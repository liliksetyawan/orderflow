# golangci-lint v2 config. Conservative on purpose — these are the linters
# that catch real bugs rather than enforce style preferences. Add more
# carefully; every linter you turn on becomes a thing reviewers argue about.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck       # unhandled errors
    - govet          # vet checks
    - ineffassign    # ineffective assignments
    - staticcheck    # broad static analysis (subsumes gosimple in v2)
    - unused         # unused symbols
    - misspell       # spelling
    - unconvert      # unnecessary type conversions
    - bodyclose      # http response body closed
    - errorlint      # errors.Is/As correctness

  settings:
    errcheck:
      # Don't fail on these idiomatic ignores; we audit them at review time.
      exclude-functions:
        - (io.Closer).Close
        - (github.com/jackc/pgx/v5.Tx).Rollback

  exclusions:
    # generated:lax is v2 default; spelled out for clarity. Files with a
    # "Code generated by ... DO NOT EDIT" header (mockgen output) are
    # skipped automatically by this rule.
    generated: lax
    # paths is regex (Go syntax), not glob — '**/mocks' would fail to compile.
    paths:
      - '/mocks/'
    rules:
      # Test files often use unchecked errors deliberately.
      - path: '_test\.go$'
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/liliksetyawan/orderflow
