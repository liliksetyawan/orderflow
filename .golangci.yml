# golangci-lint config. Conservative on purpose — these are the linters that
# catch real bugs rather than enforce style preferences. Add more carefully;
# every linter you turn on becomes a thing reviewers argue about.

run:
  timeout: 5m
  tests: true

issues:
  exclude-dirs:
    - "**/mocks"           # generated by mockgen
  exclude-files:
    - ".*\\.pb\\.go$"      # generated protobuf, when added later
  exclude-rules:
    # Test files often dot-import or use unchecked errors deliberately.
    - path: _test\.go
      linters:
        - errcheck
        - gosec

linters:
  disable-all: true
  enable:
    - errcheck       # unhandled errors
    - govet          # vet checks
    - ineffassign    # ineffective assignments
    - staticcheck    # broad static analysis
    - unused         # unused symbols
    - gosimple       # simplifications
    - gofmt          # formatting
    - goimports      # import grouping
    - misspell       # spelling
    - unconvert      # unnecessary type conversions
    - bodyclose      # http response body closed
    - errorlint      # errors.Is/As correctness

linters-settings:
  goimports:
    local-prefixes: github.com/liliksetyawan/orderflow
  errcheck:
    # Don't fail on these idiomatic ignores; we already audit them at review time.
    exclude-functions:
      - (io.Closer).Close
      - (*github.com/jackc/pgx/v5.Tx).Rollback
