name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight CI runs for the same ref when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"

jobs:
  lint:
    name: Lint (vet + golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61

  build-test:
    name: Build + test (race + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go mod tidy is up to date
        # Catches accidental drift between code and go.mod/go.sum.
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go build
        run: go build ./...

      - name: go test -race -cover
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -20

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  mocks-uptodate:
    name: Verify mocks are in sync with port files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Regenerate mocks
        # If the committed mocks differ from what mockgen produces, the
        # subsequent `git diff` fails — meaning a port interface changed
        # but `make mocks` wasn't re-run.
        run: go generate ./...

      - name: Diff after regenerate
        run: git diff --exit-code
